name: Build APK Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK (테스트 및 린트 강제 무시)
        run: ./gradlew assembleDebug -x test -x lint

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: capod-debug-apk
          path: '**/*.apk'
